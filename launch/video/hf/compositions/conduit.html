<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>conduit</title></head>
  <body>
    <template>
      <style>
@font-face { font-family: "Newsreader"; src: url("assets/fonts/newsreader-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Newsreader"; src: url("assets/fonts/newsreader-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Newsreader"; src: url("assets/fonts/newsreader-latin-400-italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
@font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "IBM Plex Sans"; src: url("assets/fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "IBM Plex Mono"; src: url("assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
#root { position: absolute; inset: 0; overflow: hidden; color: #ecedef; font-family: "IBM Plex Sans", sans-serif;
  --paper: #0b0c0e; --surface: #121418; --sunken: #08090a; --ink: #ecedef; --ink-2: #a5a9b1; --ink-3: #82868f;
  --rule: #1f2228; --rule-strong: #2e323a; --accent: #8c9eff; --pass: #4cc38a; --fail: #ff7563; }
#conduit-ground { position: absolute; inset: 0; background: var(--paper); }
#root .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 18px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); }
#root .serif { font-family: "Newsreader", serif; font-weight: 400; letter-spacing: -0.02em; }
#root .mono { font-family: "IBM Plex Mono", monospace; }
#root .chip { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: 18px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--rule-strong); color: var(--ink-2); }
#root .chip.fail { color: var(--fail); border-color: rgba(255,117,99,0.45); }
#root .chip.pass { color: var(--pass); border-color: rgba(76,195,138,0.45); }
#root .win { position: absolute; border-radius: 14px; overflow: hidden; background: var(--surface); border: 1px solid var(--rule-strong);
  box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 24px 60px rgba(0,0,0,0.55), 0 4px 14px rgba(0,0,0,0.4); }
#root .win .bar { position: absolute; left: 0; right: 0; top: 0; height: 40px; background: #16181d; border-bottom: 1px solid var(--rule); display: flex; align-items: center; padding: 0 16px; gap: 8px; }
#root .win .dot { width: 11px; height: 11px; border-radius: 50%; background: #2e323a; }
#root .win .addr { margin-left: 14px; font-family: "IBM Plex Mono", monospace; font-size: 15px; color: var(--ink-3); }
#root .win .view { position: absolute; left: 0; right: 0; bottom: 0; top: 40px; overflow: hidden; }
#root .win video { position: absolute; }
#root .label { position: absolute; font-family: "IBM Plex Mono", monospace; font-size: 17px; color: var(--ink-3); }

#cd-head { position: absolute; left: 140px; top: 80px; width: 900px; }
#cd-title { margin-top: 14px; font-size: 60px; line-height: 1.08; }
#cd-stack { margin-top: 12px; font-family: "IBM Plex Mono", monospace; font-size: 20px; color: var(--ink-3); }
#root .shot { position: absolute; top: 380px; width: 760px; }
#root .shot .frame { height: 428px; border-radius: 12px; overflow: hidden; border: 1px solid var(--rule-strong); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
#root .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
#root .shot .l { margin-top: 12px; font-family: "IBM Plex Mono", monospace; font-size: 18px; color: var(--ink-2); }
#cd-stats { position: absolute; right: 140px; top: 96px; display: flex; gap: 20px; }
#root .st { padding: 18px 22px; border-radius: 12px; background: var(--surface); border: 1px solid var(--rule-strong); min-width: 200px; }
#root .st b { display: block; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 46px; line-height: 1; }
#root .st span { display: block; margin-top: 8px; font-size: 18px; color: var(--ink-2); }
      </style>
      <div id="root" data-composition-id="conduit" data-width="1920" data-height="1080">
        <div id="conduit-ground" class="clip" data-start="0" data-duration="22.63"></div>

        <div id="cd-head"><div class="eyebrow">Second voyage, full stack</div><div id="cd-title" class="serif">RealWorld Conduit, AngularJS 2016</div>
          <div id="cd-stack">AngularJS 1.5, UI-Router, Browserify; Moleculer + NeDB API</div></div>
        <div id="cd-stats"><div id="cd-s1" class="st"><b>16</b><span>proven on the original</span></div>
          <div id="cd-s2" class="st"><b style="color:var(--pass)">14/16</b><span>proven by round 2</span></div>
          <div id="cd-s3" class="st"><b style="color:var(--pass)">13/16</b><span>parity identical</span></div></div>
        <div id="cd-a" class="shot" style="left:140px"><div class="frame"><img src="assets/shots/conduit-original-feed.jpg" alt="Kane screenshot of the AngularJS original" /></div><div class="l">AngularJS original, Kane screenshot</div></div>
        <div id="cd-b" class="shot" style="left:1020px"><div class="frame"><img src="assets/shots/conduit-nextjs-feed.jpg" alt="Kane screenshot of the Next.js rebuild" /></div><div class="l">Next.js full stack rebuild, round 2, Kane screenshot</div></div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const S = [0.5,7.71,15.22];

        tl.fromTo("#cd-head > *", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.12, ease: "power3.out" }, 0.05);
        tl.fromTo("#cd-a", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.4);
        tl.fromTo("#cd-s1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5 }, S[1]);
        tl.fromTo("#cd-b", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, S[1] + 2);
        tl.fromTo("#cd-s2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5 }, S[2]);
        tl.fromTo("#cd-s3", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5 }, S[2] + 2);
        tl.fromTo(["#cd-a .frame img", "#cd-b .frame img"], { scale: 1 }, { scale: 1.06, duration: 22.63, ease: "none" }, 0);
        window.__timelines["conduit"] = tl;
      </script>
    </template>
  </body>
</html>
